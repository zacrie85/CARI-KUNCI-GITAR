name: Build Windows EXE

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download ffmpeg (static build, akan dibundle ke dalam exe)
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffbin
          Copy-Item "ffbin\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe" -Destination ffmpeg.exe
          "ffmpeg.exe siap: $([math]::Round((Get-Item ffmpeg.exe).Length / 1MB, 1)) MB"

      - name: Build ChordKu.exe (ffmpeg ter-bundle di dalam exe)
        shell: pwsh
        run: |
          $pyi = @('--noconfirm','--onefile','--windowed','--name','ChordKu','--icon','icon.ico')
          if (Test-Path ffmpeg.exe) {
            $pyi += @('--add-binary','ffmpeg.exe;.')
          } else {
            Write-Host 'PERINGATAN: ffmpeg.exe tidak tersedia, build TANPA bundling'
          }
          # browser tersemat (pywebview/WebView2) + pythonnet ikut terkumpul
          $pyi += @('--collect-all','webview','--collect-all','clr_loader',
                    '--collect-all','pythonnet','--hidden-import','bottle')
          $pyi += 'chordku.py'
          pyinstaller @pyi

      - name: Smoke test (CLI transpose)
        run: python chordku.py --cli-transpose samples/pujaan_hati.txt --from C --to D

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChordKu-Windows-exe
          path: dist/ChordKu.exe

      - name: Attach EXE to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChordKu.exe
